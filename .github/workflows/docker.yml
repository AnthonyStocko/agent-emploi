# Vérifie que l'image Docker se construit pour les deux architectures (arm64 : VM Oracle ; amd64 : PC),
# puis qu'elle démarre et répond sur /healthz. Ne publie aucune image.
name: Image Docker

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Construire (arm64 et amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: false
      - name: Démarrer et tester /healthz (amd64)
        run: |
          docker build -t agent:ci .
          docker run -d --name agent -p 8765:8765 agent:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/healthz && exit 0; sleep 1; done
          docker logs agent; exit 1
